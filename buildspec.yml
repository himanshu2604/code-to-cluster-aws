version: 0.2

env:
  variables:
    TRIVY_VERSION: "0.76.0"
    GITLEAKS_VERSION: "8.30.1"

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v${TRIVY_VERSION}
      - curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks
      - trivy --version
      - gitleaks version

  pre_build:
    commands:
      - echo "HTML lint"
      - npx --yes htmlhint@1.1.4 index.html
      - echo "Secret scan"
      - gitleaks detect --no-git --source . --redact --exit-code 1
      - echo "ECR login"
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
      - REPO_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-7)-$CODEBUILD_BUILD_NUMBER
      - echo "Image tag is $IMAGE_TAG"

  build:
    commands:
      - docker build -t $REPO_URI:$IMAGE_TAG .
      - echo "Smoke test"
      - docker run -d --name smoke -p 8080:8080 $REPO_URI:$IMAGE_TAG
      - sleep 3
      - curl -fsS http://localhost:8080/health
      - curl -fsS http://localhost:8080/ | grep -qi "<html"
      - docker rm -f smoke
      - echo "Trivy scan"
      - trivy image --no-progress --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed $REPO_URI:$IMAGE_TAG
      - docker push $REPO_URI:$IMAGE_TAG
      - printf '[{"name":"%s","imageUri":"%s"}]' $CONTAINER_NAME $REPO_URI:$IMAGE_TAG > imagedefinitions.json
      - cat imagedefinitions.json

  post_build:
    commands:
      - echo "Build finished"

artifacts:
  files:
    - imagedefinitions.json
